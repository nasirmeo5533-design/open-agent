<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Social media planning and publishing workflow</title>
  <desc id="desc">A monochrome editorial composition showing a monthly calendar feeding scheduled posts into a steady publishing rhythm.</desc>

  <rect width="1600" height="900" fill="#f5f5f6"/>

  <!-- calendar sheet -->
  <rect x="120" y="112" width="760" height="676" rx="18" fill="#ffffff" stroke="#c9ced2" stroke-width="5"/>
  <path d="M138 112 H862 V222 H120 V130 A18 18 0 0 1 138 112 Z" fill="#00101a"/>
  <rect x="174" y="164" width="96" height="16" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="300" y="164" width="60" height="16" rx="8" fill="#ffffff" opacity="0.45"/>
  <rect x="390" y="164" width="60" height="16" rx="8" fill="#ffffff" opacity="0.45"/>

  <!-- calendar grid -->
  <g stroke="#e6e8ea" stroke-width="5">
    <path d="M174 262 H826 M174 342 H826 M174 422 H826 M174 502 H826 M174 582 H826 M174 662 H826 M174 742 H826"/>
    <path d="M174 242 V742 M288 242 V742 M402 242 V742 M516 242 V742 M630 242 V742 M744 242 V742 M826 242 V742"/>
  </g>

  <!-- scheduled post blocks -->
  <rect x="190" y="276" width="82" height="50" rx="7" fill="#00101a"/>
  <rect x="418" y="276" width="82" height="50" rx="7" fill="#d8dcde"/>
  <rect x="646" y="276" width="82" height="50" rx="7" fill="#00101a"/>

  <rect x="304" y="356" width="82" height="50" rx="7" fill="#c5c8cc"/>
  <rect x="532" y="356" width="82" height="50" rx="7" fill="#00101a"/>

  <rect x="190" y="436" width="82" height="50" rx="7" fill="#d8dcde"/>
  <rect x="418" y="436" width="82" height="50" rx="7" fill="#00101a"/>
  <rect x="760" y="436" width="50" height="50" rx="7" fill="#c5c8cc"/>

  <rect x="304" y="516" width="82" height="50" rx="7" fill="#00101a"/>
  <rect x="646" y="516" width="82" height="50" rx="7" fill="#d8dcde"/>

  <rect x="190" y="596" width="82" height="50" rx="7" fill="#c5c8cc"/>
  <rect x="418" y="596" width="82" height="50" rx="7" fill="#00101a"/>
  <rect x="532" y="596" width="82" height="50" rx="7" fill="#c5c8cc"/>

  <rect x="304" y="676" width="82" height="50" rx="7" fill="#d8dcde"/>
  <rect x="646" y="676" width="82" height="50" rx="7" fill="#00101a"/>

  <!-- publishing flow -->
  <path d="M900 450 H980" stroke="#00101a" stroke-width="14" stroke-linecap="square"/>
  <path d="M954 414 L1000 450 L954 486 Z" fill="#00101a"/>

  <!-- fanned post screens -->
  <g transform="rotate(7 1260 430)">
    <rect x="1100" y="180" width="320" height="500" rx="18" fill="#e6e8ea" stroke="#c9ced2" stroke-width="5"/>
    <rect x="1132" y="220" width="256" height="180" rx="10" fill="#ffffff"/>
    <circle cx="1298" cy="290" r="38" fill="#c5c8cc"/>
    <path d="M1148 382 L1214 312 L1260 352 L1312 296 L1372 382 Z" fill="#00101a"/>
    <rect x="1132" y="430" width="220" height="12" rx="6" fill="#ffffff"/>
    <rect x="1132" y="462" width="160" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
  </g>

  <g transform="rotate(-6 1190 430)">
    <rect x="1030" y="220" width="320" height="500" rx="18" fill="#ffffff" stroke="#00101a" stroke-width="5"/>
    <rect x="1062" y="260" width="256" height="180" rx="10" fill="#00101a"/>
    <path d="M1098 414 L1172 330 L1230 384 L1284 322 L1318 414 Z" fill="#ffffff" opacity="0.88"/>
    <circle cx="1250" cy="312" r="30" fill="#c5c8cc"/>
    <rect x="1062" y="470" width="220" height="12" rx="6" fill="#00101a"/>
    <rect x="1062" y="502" width="160" height="12" rx="6" fill="#c5c8cc"/>
  </g>

  <!-- cadence loop -->
  <circle cx="1310" cy="748" r="74" fill="none" stroke="#00101a" stroke-width="14" stroke-linecap="round" stroke-dasharray="390 72"/>
  <path d="M1262 684 L1296 710 L1258 730 Z" fill="#00101a"/>
  <path d="M1310 706 V750 L1342 770" fill="none" stroke="#00101a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
