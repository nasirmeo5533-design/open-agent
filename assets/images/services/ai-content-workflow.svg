<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">AI content production and human review</title>
  <desc id="desc">A monochrome editorial composition showing written drafts, an image frame and a short-form video strip moving through a review check.</desc>

  <rect width="1600" height="900" fill="#f5f5f6"/>

  <!-- back sheet -->
  <rect x="210" y="146" width="760" height="650" rx="18" fill="#e6e8ea"/>

  <!-- main production sheet -->
  <rect x="170" y="112" width="760" height="650" rx="18" fill="#ffffff" stroke="#c9ced2" stroke-width="5"/>

  <!-- copy block -->
  <rect x="230" y="174" width="260" height="18" rx="9" fill="#00101a"/>
  <rect x="230" y="226" width="560" height="14" rx="7" fill="#d8dcde"/>
  <rect x="230" y="260" width="470" height="14" rx="7" fill="#d8dcde"/>
  <rect x="230" y="294" width="520" height="14" rx="7" fill="#d8dcde"/>

  <!-- image output -->
  <rect x="230" y="350" width="340" height="230" rx="12" fill="#f5f5f6" stroke="#c9ced2" stroke-width="5"/>
  <circle cx="478" cy="420" r="34" fill="#c5c8cc"/>
  <path d="M244 566 L352 438 L424 520 L476 462 L556 566 Z" fill="#00101a"/>

  <!-- video output -->
  <rect x="600" y="350" width="280" height="230" rx="12" fill="#00101a"/>
  <path d="M718 425 L718 505 L782 465 Z" fill="#ffffff"/>
  <rect x="632" y="532" width="216" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
  <rect x="632" y="532" width="88" height="8" rx="4" fill="#ffffff"/>

  <!-- lower draft lines -->
  <rect x="230" y="618" width="650" height="14" rx="7" fill="#d8dcde"/>
  <rect x="230" y="652" width="520" height="14" rx="7" fill="#d8dcde"/>
  <rect x="230" y="686" width="580" height="14" rx="7" fill="#d8dcde"/>

  <!-- flow arrow -->
  <path d="M950 438 H1058" stroke="#00101a" stroke-width="14" stroke-linecap="square"/>
  <path d="M1032 402 L1078 438 L1032 474 Z" fill="#00101a"/>

  <!-- human review seal -->
  <circle cx="1270" cy="380" r="150" fill="#00101a"/>
  <circle cx="1270" cy="380" r="112" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.42"/>
  <path d="M1202 382 L1252 432 L1348 330" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- output tray -->
  <rect x="1080" y="610" width="380" height="70" rx="10" fill="#ffffff" stroke="#c9ced2" stroke-width="5"/>
  <rect x="1104" y="636" width="22" height="22" rx="4" fill="#00101a"/>
  <rect x="1144" y="638" width="220" height="12" rx="6" fill="#d8dcde"/>
  <rect x="1388" y="638" width="44" height="12" rx="6" fill="#c5c8cc"/>

  <rect x="1080" y="700" width="380" height="70" rx="10" fill="#ffffff" stroke="#c9ced2" stroke-width="5"/>
  <rect x="1104" y="726" width="22" height="22" rx="4" fill="#00101a"/>
  <rect x="1144" y="728" width="180" height="12" rx="6" fill="#d8dcde"/>
  <rect x="1388" y="728" width="44" height="12" rx="6" fill="#c5c8cc"/>
</svg>
